<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Calc - Calculadora de Refino</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <div class="app-container">

    <!-- 1. Cabeçalho Principal (Navegação SPA Nível 1) -->
    <header class="app-header">
      <div class="main-tabs">
        <button class="tab-btn active" id="tab-refine">Refino</button>
        <button class="tab-btn disabled" id="tab-craft" disabled>Crafting <small>(Breve)</small></button>
      </div>
    </header>

    <!-- Layout principal: coluna de config (esquerda no desktop) + coluna de conteúdo (direita) -->
    <div class="main-layout">

      <!-- 3. Painel de Configurações (Acordeão Colapsável) -->
      <section class="config-section">
        <details class="config-details" id="config-details">
          <summary class="config-summary">
            <span class="config-summary-text">⚙️ Configurações e Filtros</span>
          </summary>
          <div class="config-grid">

            <!-- Seleção do recurso analisado -->
            <div class="resource-filter">
              <span class="section-title"> </span>
              <nav class="resource-nav" id="resource-selector" aria-label="Tipo de recurso">
                <button class="res-btn active" data-res="ORE">Minério</button>
                <button class="res-btn" data-res="WOOD">Madeira</button>
                <button class="res-btn" data-res="HIDE">Couro</button>
                <button class="res-btn" data-res="FIBER">Fibra</button>
                <button class="res-btn" data-res="STONE">Pedra</button>
              </nav>
            </div>

            <!-- Seletor de Tiers (Abas Rápidas) -->
            <div class="tier-selector" id="tier-selector">
              <button class="tier-btn" data-tier="2">T2</button>
              <button class="tier-btn active" data-tier="3">T3</button>
              <button class="tier-btn" data-tier="4">T4</button>
              <button class="tier-btn" data-tier="5">T5</button>
              <button class="tier-btn" data-tier="6">T6</button>
              <button class="tier-btn" data-tier="7">T7</button>
              <button class="tier-btn" data-tier="8">T8</button>
            </div>

            <!-- Filtro opcional de encantamentos; vazio significa exibir todos -->
            <div class="enchantment-filter" id="enchantment-filter">
              <div class="enchantment-options">
                <label class="enchantment-check"><input type="checkbox" class="enchantment-filter-input" value="0"> .0</label>
                <label class="enchantment-check"><input type="checkbox" class="enchantment-filter-input" value="1"> .1</label>
                <label class="enchantment-check"><input type="checkbox" class="enchantment-filter-input" value="2"> .2</label>
                <label class="enchantment-check"><input type="checkbox" class="enchantment-filter-input" value="3"> .3</label>
                <label class="enchantment-check"><input type="checkbox" class="enchantment-filter-input" value="4"> .4</label>
              </div>
            </div>

            <!-- Premium & Foco Switches -->
            <div class="toggle-group">
              <label class="switch-label">
                <input type="checkbox" id="chk-premium" checked>
                <span class="switch-custom"></span>
                Premium Ativo
              </label>
              <label class="switch-label">
                <input type="checkbox" id="chk-focus">
                <span class="switch-custom"></span>
                Usar Foco <span class="focus-gold">(RRR+)</span>
              </label>
            </div>

            <!-- Taxa de Nutrição da Estação -->
            <div class="input-group">
              <label for="txt-taxa-estacao">Taxa da Refinaria (por 100 Nutrição):</label>
              <input type="number" id="txt-taxa-estacao" value="500" min="0" step="10">
            </div>

            <!-- Filtro de Cidades -->
            <div class="cities-group">
              <span class="section-title">Cidades Analisadas:</span>
              <div class="cities-grid">
                <label class="city-check"><input type="checkbox" class="city-filter" value="Brecilien" checked> Brecilien</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Bridgewatch" checked> Bridgewatch</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Caerleon" checked> Caerleon</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Fort Sterling" checked> Fort Sterling</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Lymhurst" checked> Lymhurst</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Martlock" checked> Martlock</label>
                <label class="city-check"><input type="checkbox" class="city-filter" value="Thetford" checked> Thetford</label>
              </div>
            </div>

            <div class="config-reset">
              <button class="btn-secondary" id="btn-reset-prices">Redefinir preços</button>
            </div>

          </div>
        </details>
      </section>

      <!-- Coluna de conteúdo: decisão + tabela -->
      <div class="content-column">
        <!-- 5. Painel de Tomada de Decisão (Melhor Rota) -->
        <section class="decision-card" id="decision-card">
          <div class="decision-content">
            <span class="decision-title">💡 Melhor Rota Encontrada</span>
            <p class="decision-text" id="decision-text">Carregando dados de preços...</p>
          </div>
        </section>

        <!-- 6. Área Principal de Dados (Tabela de Refino) -->
        <main class="main-content">
          <div class="table-container">
            <table class="refine-table" id="refine-table">
              <thead>
                <tr>
                  <th>Recurso Refinado</th>
                  <th>Cidade</th>
                  <th>Insumo Bruto</th>
                  <th>Insumo Refinado</th>
                  <th>Preço Venda</th>
                  <th>Custo Unitário</th>
                  <th>Lucro Unitário</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <!-- As linhas da tabela (.0 a .4) serão inseridas dinamicamente pelo app.js -->
              </tbody>
            </table>
          </div>
        </main>

      </div>
      <!-- /content-column -->

    </div>
    <!-- /main-layout -->

    <!-- 7. Rodapé / Botão de Reset de Preços -->
    <footer class="app-footer">
      <div class="footer-info">Dados obtidos via AODP.</div>
    </footer>

  </div>

  <!-- Scripts -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
